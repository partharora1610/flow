<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapter 1 · Auto-play film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Libre+Franklin:wght@400;500;600&family=Courier+Prime:wght@400;700&family=Kalam:wght@700&display=swap">
<link rel="stylesheet" href="shared/story.css">
<style>
  /* Version B: a letterboxed mini explainer video that plays on its own */
  .wrap{min-height:100vh;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    padding-block:72px 32px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .film{position:relative;width:min(1100px, 100%);aspect-ratio:16 / 9;max-width:100%;background:#0E0D0B;box-shadow:var(--lift)}
  .film .stage{position:absolute;inset:0}
  .film::before,.film::after{content:"";position:absolute;left:0;right:0;height:6%;background:#0E0D0B;z-index:3}
  .film::before{top:0} .film::after{bottom:0}
  .big-play{all:unset;cursor:pointer;position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);display:flex;align-items:center;gap:12px;padding:16px 26px;border-radius:999px;
    background:var(--volt);color:var(--ink);font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;box-shadow:var(--lift)}
  .big-play:focus-visible{outline:2.5px solid var(--red);outline-offset:3px}
  .controls{width:min(1100px, 100%);display:flex;align-items:center;gap:14px}
  .ctl{all:unset;cursor:pointer;width:44px;height:44px;border-radius:999px;background:var(--ink);color:#F4EEE2;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ctl:focus-visible{outline:2.5px solid var(--red);outline-offset:3px}
  .scrub{flex:1 1 auto;min-width:0;accent-color:var(--red);height:28px}
  .time{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--mist);font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<header class="proto-bar"><a href="index.html">&larr; All versions</a><span>B · Auto-play film</span></header>

<main class="wrap">
  <div class="film">
    <div class="stage" id="stage"></div>
    <button class="big-play" id="bigPlay" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      Play chapter 1
    </button>
  </div>
  <div class="controls">
    <button class="ctl" id="toggle" type="button" aria-label="Play">
      <svg class="i-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg class="i-pause" hidden width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <span class="time" id="time">0:00 / 0:16</span>
  </div>
</main>

<script src="shared/story.js"></script>
<script>
(() => {
  const scene = Story.mount(document.getElementById('stage'));
  const toggle = document.getElementById('toggle'), bigPlay = document.getElementById('bigPlay'), scrub = document.getElementById('scrub'), time = document.getElementById('time');
  const iPlay = toggle.querySelector('.i-play'), iPause = toggle.querySelector('.i-pause');
  const D = Story.DURATION;
  let t = 0, prev = 0, playing = false, last = 0;
  const fmt = (s) => '0:' + String(Math.floor(s)).padStart(2, '0');
  function show() {
    scene.render(t);
    scrub.value = String(Math.round((t / D) * 1000));
    time.textContent = fmt(t) + ' / ' + fmt(D);
  }
  function setPlaying(on) {
    playing = on;
    iPlay.hidden = on; iPause.hidden = !on;
    toggle.setAttribute('aria-label', on ? 'Pause' : 'Play');
    bigPlay.hidden = true;
    if (!on) Story.hush();
    if (on) { last = performance.now(); requestAnimationFrame(loop); }
  }
  function loop(now) {
    if (!playing) return;
    t = Math.min(D, t + (now - last) / 1000); last = now;
    show();
    scene.fire(prev, t); prev = t;
    if (t >= D) { setPlaying(false); bigPlay.hidden = false; bigPlay.lastChild.textContent = ' Replay'; return; }
    requestAnimationFrame(loop);
  }
  function play() {
    Story.init();
    if (t >= D) { t = 0; prev = 0; }
    setPlaying(true);
  }
  bigPlay.addEventListener('click', play);
  toggle.addEventListener('click', () => (playing ? setPlaying(false) : play()));
  scrub.addEventListener('input', () => { t = (Number(scrub.value) / 1000) * D; prev = t; Story.hush(); bigPlay.hidden = true; show(); });
  show();
})();
</script>
</body>
</html>
